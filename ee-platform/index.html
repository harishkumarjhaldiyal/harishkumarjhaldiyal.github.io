    </style></head><body><div id="root"></div><div id="demo-disclaimer"><strong>Interactive prototype</strong> — built and maintained by Harish Kumar · every student, supervisor, and document shown here is entirely fictional · fully offline, no login, no external services, no real school data.</div><script>
  /* Phone layout: top bar + slide-in navigation drawer around the app */
  (function () {
    var bar = document.createElement('div');
    bar.id = 'ee-topbar';
    bar.innerHTML = '<button type="button" id="ee-menu-btn" aria-label="Open navigation" aria-expanded="false">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>' +
      '<div class="ee-tb-title">EE Coordination Platform<span class="ee-tb-sub">Interactive prototype · fictional data</span></div>';
    document.body.appendChild(bar);
    var btn = document.getElementById('ee-menu-btn');
    function setOpen(open) {
      document.body.classList.toggle('ee-nav-open', open);
      btn.setAttribute('aria-expanded', String(open));
      btn.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
    }
    btn.addEventListener('click', function () { setOpen(!document.body.classList.contains('ee-nav-open')); });
    // Tap outside the open drawer closes it (and doesn't trigger whatever was underneath)
    document.addEventListener('click', function (e) {
      if (!document.body.classList.contains('ee-nav-open')) return;
      if (e.target.closest('nav.sidebar') || e.target.closest('#ee-menu-btn')) return;
      e.preventDefault(); e.stopPropagation(); setOpen(false);
    }, true);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('nav.sidebar .nav-btn')) {
        setTimeout(function () { setOpen(false); var m = document.querySelector('main.main'); if (m) m.scrollTop = 0; }, 80);
      }
    });
  })();
</script></body></html>
