<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>document.documentElement.classList.add('js');</script>
    {% seo %}
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/img/icon-192.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
  </head>
  <body>
    <header class="page-header" role="banner">
      <div class="header-bar">
        <a class="site-brand" href="{{ '/' | relative_url }}">Harish Kumar</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu"><span></span><span></span><span></span></button>
      </div>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
        <a href="{{ '/about.html' | relative_url }}" class="{% if page.url == '/about.html' %}active{% endif %}">About</a>
        <a href="{{ '/philosophy.html' | relative_url }}" class="{% if page.url == '/philosophy.html' %}active{% endif %}">Philosophy</a>
        <a href="{{ '/resume.html' | relative_url }}" class="{% if page.url == '/resume.html' %}active{% endif %}">Resume / CV</a>
        <a href="{{ '/resources.html' | relative_url }}" class="{% if page.url == '/resources.html' %}active{% endif %}">Resources</a>
        <a href="{{ '/projects.html' | relative_url }}" class="{% if page.url == '/projects.html' %}active{% endif %}">Digital Innovation Projects</a>
        <a href="{{ '/contact.html' | relative_url }}" class="{% if page.url == '/contact.html' %}active{% endif %}">Contact</a>
      </nav>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-footer-custom" role="contentinfo">
      <div class="footer-name">Harish Kumar</div>
      <div>IBDP Extended Essay Coordinator &amp; Mathematics Teacher &middot; Hong Kong</div>
      <div style="margin-top: 0.6rem;">
        <a href="{{ '/contact.html' | relative_url }}">Contact</a>
        &middot;
        <a href="https://linkedin.com/in/harishjhaldiyal" target="_blank" rel="noopener">LinkedIn</a>
        &middot;
        <a href="{{ '/projects.html' | relative_url }}">Digital Innovation Projects</a>
      </div>
    </footer>
    <script>
      (function () {
        var header = document.querySelector('.page-header'), toggle = document.querySelector('.nav-toggle');
        if (!header || !toggle) return;
        function setOpen(open) {
          header.classList.toggle('nav-open', open);
          toggle.setAttribute('aria-expanded', String(open));
          toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        }
        toggle.addEventListener('click', function () { setOpen(!header.classList.contains('nav-open')); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
        document.addEventListener('click', function (e) { if (!header.contains(e.target)) setOpen(false); });
      })();

      (function () {
        var nav = document.querySelector('.site-nav'), a = nav && nav.querySelector('a.active');
        if (a && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2;
      })();

      (function () {
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var targets = document.querySelectorAll('.main-content .intro-card, .main-content .page-card, .highlight, .feature-card, .pillar, .resource-tile, .evidence, .pull-quote-lg, .cta-card, .credentials-line, .tool-card');
        var counters = document.querySelectorAll('[data-count]');

        function count(el) {
          var end = parseFloat(el.getAttribute('data-count')), dec = +(el.getAttribute('data-decimals') || 0);
          var pre = el.getAttribute('data-prefix') || '', t0 = null, dur = 1100;
          function frame(t) {
            if (!t0) t0 = t;
            var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
            el.textContent = pre + (end * e).toFixed(dec);
            if (p < 1) requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);
        }

        if (reduce || !('IntersectionObserver' in window)) {
          targets.forEach(function (el) { el.classList.add('is-visible'); });
          return;
        }
        var seen = new Map(), fold = window.innerHeight;
        targets = Array.prototype.filter.call(targets, function (el) {
          return el.getBoundingClientRect().top > fold * 0.92; // already on screen at load: show immediately, never hide
        });
        targets.forEach(function (el) {
          var i = seen.get(el.parentNode) || 0;
          seen.set(el.parentNode, i + 1);
          el.style.transitionDelay = Math.min(i, 4) * 70 + 'ms';
          el.classList.add('reveal');
        });
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (!en.isIntersecting) return;
            en.target.classList.add('is-visible');
            en.target.querySelectorAll('[data-count]').forEach(count);
            io.unobserve(en.target);
          });
        }, { rootMargin: '0px 0px -6% 0px', threshold: 0.08 });
        targets.forEach(function (el) { io.observe(el); });
        counters.forEach(function (c) { if (!c.closest('.reveal')) count(c); });
      })();
    </script>
    <script data-goatcounter="https://harishkumar-portfolio.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
